name: CI

on:
  push:
    branches: [main, phase1-scanner-foundation]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q

  build-causal-graph-registry:
    if: github.event_name == 'push'
    uses: ./.github/workflows/causal-edge-adjudication.yml
    with:
      edge_input_path: 'experiments/causal_edges/ai-data-center-load-to-grid-interconnection.json'
