name: CI

on:
  push:
    branches: [main, phase1-scanner-foundation]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q

  later-confirmation-production:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e .
      - name: Download frozen replay
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '33234820223'
          pattern: pre-news-replay-33234820223-*
          path: artifacts/input/replay
          merge-multiple: true
      - name: Build holdout
        run: |
          ibs-later-confirmation \
            --plan experiments/later_confirmation/large-power-transformers-2026-08-21.json \
            --replay-result artifacts/input/replay/pre_news_rankings.json \
            --evaluation-as-of 2026-08-29T23:59:59+00:00 \
            --output-dir artifacts/later-confirmation
      - name: Validate holdout
        shell: python
        run: |
          import hashlib
          import json
          from datetime import datetime
          from pathlib import Path

          output = Path("artifacts/later-confirmation")
          diagnostic = json.loads((output / "later_confirmation_diagnostic.json").read_text())
          markdown = (output / "later_confirmation.ko.md").read_text()
          if diagnostic["plan_id"] != "large-power-transformers-2026-08-21-v1":
              raise SystemExit("unexpected frozen plan")
          if diagnostic["replay_id"] != "early-ai-electrical-2026-08-21-two-root-v2":
              raise SystemExit("unexpected replay")
          if diagnostic["node_id"] != "large-power-transformers":
              raise SystemExit("unexpected node")
          if diagnostic["replay_as_of"] != "2026-08-21T23:59:59+00:00":
              raise SystemExit("cutoff changed")
          if diagnostic["node_diagnostic_status"] != "pending":
              raise SystemExit("initial diagnostic must remain pending")
          if diagnostic["automatic_rerank"] is not False or diagnostic["original_replay_unchanged"] is not True:
              raise SystemExit("later evidence must not rerank replay")
          if diagnostic["security_thesis_readiness"] != "not_decision_grade":
              raise SystemExit("security conclusion is not authorized")
          if diagnostic["original_ranking"] != {
              "stage": "evidence_backed",
              "score": 73.0,
              "convergence_stage": "priority_convergence",
              "convergence_score": 75.07,
          }:
              raise SystemExit("original replay ranking changed")
          slots = diagnostic["slot_results"]
          required = [item for item in slots if item["required_for_node_validation"]]
          blocked = [item for item in slots if item["status"] == "blocked"]
          if len(required) != 4 or any(item["status"] != "pending" for item in required):
              raise SystemExit("four industrial slots must begin pending")
          if len(blocked) != 1 or blocked[0]["thesis_dimension"] != "expectation_gap":
              raise SystemExit("security expectation gap must remain blocked")
          cutoff = datetime.fromisoformat(diagnostic["replay_as_of"])
          if any(datetime.fromisoformat(item["not_before"]) <= cutoff for item in slots):
              raise SystemExit("post-cutoff holdout boundary changed")
          for phrase in (
              "사전에 고정한 판정 기준",
              "90일 실수요 전환",
              "180일 병목 지속성",
              "365일 공급 반응",
              "180일 경제적 수익 포착",
              "증권 기대 차이",
          ):
              if phrase not in markdown:
                  raise SystemExit("reader-facing explanation is incomplete")
          provenance = {
              "schema_version": "later-confirmation-provenance-v1",
              "replay_run_id": "33234820223",
              "plan_id": diagnostic["plan_id"],
              "plan_sha256": diagnostic["plan_sha256"],
              "diagnostic_sha256": diagnostic["diagnostic_sha256"],
              "plan_file_sha256": hashlib.sha256(
                  Path("experiments/later_confirmation/large-power-transformers-2026-08-21.json").read_bytes()
              ).hexdigest(),
              "replay_result_sha256": hashlib.sha256(
                  Path("artifacts/input/replay/pre_news_rankings.json").read_bytes()
              ).hexdigest(),
              "evaluation_as_of": diagnostic["evaluation_as_of"],
              "automatic_rerank": False,
              "original_replay_unchanged": True,
              "security_level_conclusion": False,
          }
          (output / "input_provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n"
          )
      - name: Upload holdout
        uses: actions/upload-artifact@v4
        with:
          name: later-confirmation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/later-confirmation
          if-no-files-found: error
          retention-days: 90
