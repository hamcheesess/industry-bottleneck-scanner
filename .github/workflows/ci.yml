name: CI

on:
  push:
    branches: [main, phase1-scanner-foundation]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q

  resume-sec-bootstrap:
    if: github.event_name == 'push'
    uses: ./.github/workflows/sec-operating-evidence-bootstrap.yml
    with:
      research_queue_run_id: '32717805837'
      batches_json: '["001","002","003","004","005"]'
      resume_run_id: '32800238238'
      resume_batch: '001'
    secrets: inherit
