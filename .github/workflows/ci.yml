name: CI

on:
  push:
    branches: [main, phase1-scanner-foundation]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q

  later-confirmation-production:
    uses: ./.github/workflows/later-confirmation-production.yml
    with:
      replay_run_id: '33234820223'
      plan_path: 'experiments/later_confirmation/large-power-transformers-2026-08-21.json'
      evaluation_as_of: '2026-08-29T23:59:59+00:00'
