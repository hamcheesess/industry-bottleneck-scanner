name: CI

on:
  push:
    branches: [main, phase1-scanner-foundation]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q

  build-operating-evidence:
    if: github.event_name == 'push'
    uses: ./.github/workflows/operating-evidence-build.yml
    with:
      sec_run_id: '32801209738'
      research_queue_run_id: '32717805837'
