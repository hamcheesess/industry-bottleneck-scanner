name: CI

on:
  push:
    branches: [main, phase1-scanner-foundation]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q

  build-first-pre-news-replay:
    if: github.event_name == 'push'
    uses: ./.github/workflows/pre-news-replay-production.yml
    with:
      market_calibration_run_id: '32717734277'
      root_registry_run_id: '32957567143'
      graph_registry_run_id: '33060344295'
      state_registry_run_id: '33060344295'
      replay_input_path: 'experiments/pre_news_replay/early-ai-electrical-2026-08-21.json'
      validation_profile: 'transformer_evidence_backed'
