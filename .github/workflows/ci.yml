name: CI

on:
  push:
    branches: [main, phase1-scanner-foundation]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q

  build-causal-diagnosis:
    if: github.event_name == 'push'
    uses: ./.github/workflows/causal-diagnosis-build.yml
    with:
      market_calibration_run_id: '32717805837'
      operating_evidence_run_id: '32923546556'
