name: CI

on:
  push:
    branches: [main, phase1-scanner-foundation]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q

  frozen-market-calibration:
    if: >-
      github.ref == 'refs/heads/phase1-scanner-foundation' &&
      contains(github.event.head_commit.message, '[calibrate-market]')
    uses: ./.github/workflows/provider-free-market-calibration.yml
    with:
      source_run_id: '32620277256'
