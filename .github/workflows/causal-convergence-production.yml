name: Build Causal Convergence

on:
  workflow_call:
    inputs:
      root_registry_run_id:
        required: true
        type: string
      graph_registry_run_id:
        required: true
        type: string
      state_registry_run_id:
        required: true
        type: string
      trigger_root_shock_id:
        required: true
        type: string
      as_of:
        required: true
        type: string
      validation_profile:
        required: false
        type: string
        default: 'first_path_hypothesis'
  workflow_dispatch:
    inputs:
      root_registry_run_id:
        description: Successful append-only root registry run
        required: true
        default: '32957567143'
      graph_registry_run_id:
        description: Successful canonical graph registry run
        required: true
        default: '32959261471'
      state_registry_run_id:
        description: Successful pre-trigger state registry run
        required: true
        default: '32958871184'
      trigger_root_shock_id:
        description: Approved root shock to expand
        required: true
        default: 'ai-data-center-electric-load-expansion-2026q3'
      as_of:
        description: Strict replay cutoff
        required: true
        default: '2026-08-21T23:59:59+00:00'
      validation_profile:
        description: Exact fail-closed production path profile
        required: true
        type: choice
        options:
          - first_path_hypothesis
          - transformer_pre_shock_bottleneck
        default: first_path_hypothesis

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ROOT_RUN_ID: ${{ inputs.root_registry_run_id || '32957567143' }}
      GRAPH_RUN_ID: ${{ inputs.graph_registry_run_id || '32959261471' }}
      STATE_RUN_ID: ${{ inputs.state_registry_run_id || '32958871184' }}
      TRIGGER_ROOT_ID: ${{ inputs.trigger_root_shock_id || 'ai-data-center-electric-load-expansion-2026q3' }}
      REPLAY_AS_OF: ${{ inputs.as_of || '2026-08-21T23:59:59+00:00' }}
      VALIDATION_PROFILE: ${{ inputs.validation_profile || 'first_path_hypothesis' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Validate exact upstream run IDs
        shell: bash
        run: |
          for value in "$ROOT_RUN_ID" "$GRAPH_RUN_ID" "$STATE_RUN_ID"; do
            if [[ ! "$value" =~ ^[0-9]+$ ]]; then
              echo "registry run IDs must contain only digits" >&2
              exit 2
            fi
          done

      - name: Download approved root registry
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.ROOT_RUN_ID }}
          pattern: root-shock-registry-${{ env.ROOT_RUN_ID }}-*
          path: artifacts/input/root
          merge-multiple: true

      - name: Download approved graph registry
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.GRAPH_RUN_ID }}
          pattern: causal-graph-registry-${{ env.GRAPH_RUN_ID }}-*
          path: artifacts/input/graph
          merge-multiple: true

      - name: Download pre-trigger state registry
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.STATE_RUN_ID }}
          pattern: industry-state-registry-${{ env.STATE_RUN_ID }}-*
          path: artifacts/input/state
          merge-multiple: true

      - name: Build strict-as-of branches and assessment
        run: |
          ibs-causal-convergence \
            --root-shock-registry artifacts/input/root/root_shocks.jsonl \
            --causal-graph-registry artifacts/input/graph/graph.jsonl \
            --industry-state-registry artifacts/input/state/industry_state.jsonl \
            --trigger-root-shock-id "$TRIGGER_ROOT_ID" \
            --as-of "$REPLAY_AS_OF" \
            --output-dir artifacts/convergence

      - name: Validate fail-closed first-path result and write provenance
        shell: python
        run: |
          import hashlib
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          output = Path("artifacts/convergence")
          convergence = json.loads((output / "demand_convergence.json").read_text())
          branches = [json.loads(line) for line in (output / "demand_branches.jsonl").read_text().splitlines() if line]
          assessments = {item["node_id"]: item for item in convergence["assessments"]}
          for assessment in assessments.values():
              state = assessment.get("pre_shock_state")
              if state is not None and datetime.fromisoformat(state["as_of"]) >= datetime.fromisoformat(assessment["trigger_detected_at"]):
                  raise SystemExit("pre-shock state must be strictly earlier than trigger detection")

          profile = os.environ["VALIDATION_PROFILE"]
          if profile == "first_path_hypothesis":
              if convergence["branch_count"] != 1 or convergence["assessment_count"] != 1:
                  raise SystemExit("first production convergence must contain one path and one assessment")
              assessment = assessments.get("large-load-grid-interconnection-capacity")
              if assessment is None or assessment.get("pre_shock_state") is None:
                  raise SystemExit("first production convergence requires an explicit grid-interconnection state")
              if assessment["stage"] != "hypothesis" or assessment["gate_reasons"] != ["pre_shock_state_not_constrained"]:
                  raise SystemExit("first path must remain fail-closed until its state is constrained")
              expected_paths = [[
                  "ai-data-center-electric-load-growth",
                  "large-load-grid-interconnection-capacity",
              ]]
          elif profile == "transformer_pre_shock_bottleneck":
              if convergence["branch_count"] != 2 or convergence["assessment_count"] != 2:
                  raise SystemExit("transformer production convergence must contain two paths and two assessments")
              if set(assessments) != {
                  "large-load-grid-interconnection-capacity",
                  "large-power-transformers",
              }:
                  raise SystemExit("unexpected transformer production assessment nodes")
              grid = assessments["large-load-grid-interconnection-capacity"]
              if grid["stage"] != "hypothesis" or grid["gate_reasons"] != ["pre_shock_state_not_constrained"]:
                  raise SystemExit("grid-interconnection segment must remain fail-closed")
              transformer = assessments["large-power-transformers"]
              transformer_state = transformer.get("pre_shock_state")
              if transformer["stage"] != "pre_shock_bottleneck" or transformer["gate_reasons"] != []:
                  raise SystemExit("transformer path must resolve only to pre_shock_bottleneck")
              if transformer_state is None or transformer_state["stage"] != "severely_constrained" or transformer_state["constraint_score"] != 84.0:
                  raise SystemExit("transformer path requires the exact approved pre-shock state")
              if transformer["independent_root_shock_ids"] != [os.environ["TRIGGER_ROOT_ID"]]:
                  raise SystemExit("transformer path must not invent independent demand roots")
              expected_paths = [
                  [
                      "ai-data-center-electric-load-growth",
                      "large-load-grid-interconnection-capacity",
                  ],
                  [
                      "ai-data-center-electric-load-growth",
                      "large-load-grid-interconnection-capacity",
                      "large-power-transformers",
                  ],
              ]
          else:
              raise SystemExit(f"unsupported convergence validation profile: {profile}")

          actual_paths = sorted(item["path_nodes"] for item in branches)
          if actual_paths != sorted(expected_paths):
              raise SystemExit("unexpected production causal paths")

          inputs = {
              "root_registry": Path("artifacts/input/root/root_shocks.jsonl"),
              "graph_registry": Path("artifacts/input/graph/graph.jsonl"),
              "state_registry": Path("artifacts/input/state/industry_state.jsonl"),
          }
          provenance = {
              "schema_version": "causal-convergence-provenance-v1",
              "as_of": os.environ["REPLAY_AS_OF"],
              "trigger_root_shock_id": os.environ["TRIGGER_ROOT_ID"],
              "validation_profile": profile,
              "upstream_run_ids": {
                  "root": os.environ["ROOT_RUN_ID"],
                  "graph": os.environ["GRAPH_RUN_ID"],
                  "state": os.environ["STATE_RUN_ID"],
              },
              "input_sha256": {
                  name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for name, path in inputs.items()
              },
              "strict_pre_trigger_state": True,
              "automatic_promotion": False,
          }
          (output / "input_provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n"
          )

      - name: Upload provider-free convergence artifact
        uses: actions/upload-artifact@v4
        with:
          name: causal-convergence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/convergence
          if-no-files-found: error
          retention-days: 90
