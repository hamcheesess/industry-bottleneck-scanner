[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "industry-bottleneck-scanner"
version = "0.1.0"
description = "Phenomenon-first scanner for emerging industry bottlenecks"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ibs-transcript-coverage = "industry_bottleneck_scanner.coverage_cli:main"
ibs-transcript-collect = "industry_bottleneck_scanner.collection_cli:main"
ibs-pilot-diagnostics = "industry_bottleneck_scanner.pilot_diagnostics_cli:main"
ibs-phase1-batch = "industry_bottleneck_scanner.batch_cli:main"
ibs-phase1-pilot = "industry_bottleneck_scanner.phase1_pilot_cli:main"
ibs-phase1-validate = "industry_bottleneck_scanner.validation_cli:main"
ibs-phase1-validation-ready = "industry_bottleneck_scanner.validation_ready_cli:main"
ibs-phase1-validation-collect = "industry_bottleneck_scanner.validation_collection_cli:main"
ibs-phase1-validation-metadata-draft = "industry_bottleneck_scanner.validation_metadata_cli:main"
ibs-phase1-validation-metadata-finalize = "industry_bottleneck_scanner.validation_metadata_finalize_cli:main"
ibs-phase1-validation-progress = "industry_bottleneck_scanner.validation_progress_cli:main"
ibs-phase1-validation-run = "industry_bottleneck_scanner.validation_run_cli:main"
ibs-phase1-validation-advance = "industry_bottleneck_scanner.validation_advance_cli:main"
ibs-phase1-validation-diagnose = "industry_bottleneck_scanner.validation_diagnose_cli:main"
ibs-phase1-calibration-diagnose = "industry_bottleneck_scanner.validation_calibration_cli:main"
ibs-phase1-calibration-rerun = "industry_bottleneck_scanner.validation_recalibrate_cli:main"
ibs-phase1-evidence-audit = "industry_bottleneck_scanner.validation_evidence_audit_cli:main"
ibs-phase1-control-evidence = "industry_bottleneck_scanner.validation_control_evidence_cli:main"
ibs-neutral-cohort-plan = "industry_bottleneck_scanner.cohort_cli:main"
ibs-neutral-proxy-iwv = "industry_bottleneck_scanner.iwv_proxy_cli:main"
ibs-phase1-proxy-plan = "industry_bottleneck_scanner.proxy_plan_cli:main"
ibs-review-language = "industry_bottleneck_scanner.novel_language_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
