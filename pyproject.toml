ibs-market-trigger-quality = "industry_bottleneck_scanner.market_trigger_quality_cli:main"
ibs-market-trigger-research-queue = "industry_bottleneck_scanner.market_trigger_research_queue_cli:main"
ibs-massive-universe = "industry_bottleneck_scanner.massive_universe_cli:main"
ibs-operating-evidence = "industry_bottleneck_scanner.operating_evidence_cli:main"
ibs-operating-evidence-batch = "industry_bottleneck_scanner.operating_evidence_batch_cli:main"
ibs-causal-diagnosis-batch = "industry_bottleneck_scanner.causal_diagnosis_batch_cli:main"
