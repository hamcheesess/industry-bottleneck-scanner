[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "industry-bottleneck-scanner"
version = "0.1.0"
description = "Phenomenon-first scanner for emerging industry bottlenecks"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ibs-transcript-coverage = "industry_bottleneck_scanner.coverage_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
